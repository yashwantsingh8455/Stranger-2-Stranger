<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Room | Stranger 2 Stranger</title><link rel="stylesheet" href="/white-sky-ui.css"><link rel="stylesheet" href="/social.css"></head><body><main style="max-width:620px;margin:12vh auto;padding:20px"><div class="card"><h1>Checking voice room…</h1><p class="meta" id="status">Verifying your session and age-group access.</p><a class="btn btn-white" href="/discover.html#communities">Back to Discover</a></div></main><script>
function headers(){const h={};if(localStorage.getItem('authMode')==='guest')h['X-Guest-Token']=localStorage.getItem('guestToken')||'';else h.Authorization='Bearer '+(localStorage.getItem('fbToken')||'');return h}
(async()=>{const key=location.pathname.split('/').filter(Boolean).pop();try{const r=await fetch('/api/social/voice-rooms/'+encodeURIComponent(key),{headers:headers()});const b=await r.json();if(!r.ok)throw new Error(b.error||'Voice room unavailable.');document.getElementById('status').textContent='Access verified. Opening '+b.room.title+'…';location.replace('/call.html?mode=voice&room='+encodeURIComponent(b.room.roomKey));}catch(e){document.querySelector('h1').textContent='Cannot open this voice room';document.getElementById('status').textContent=e.message;}})();
</script></body></html>
