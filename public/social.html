lor:var(--text);padding:11px 12px;border-radius:11px;outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#5ee7f0}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);padding:10px 12px;border-radius:12px}.switch input{width:auto}.matchbox{min-height:430px;display:grid;grid-template-rows:auto 1fr auto}.match-partner{text-align:center;padding:22px}.match-partner .avatar{width:86px;height:86px;margin:0 auto 12px;font-size:26px}.chatlog{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#090f1b;display:flex;flex-direction:column;gap:8px}.bubble{max-width:78%;padding:9px 11px;border-radius:13px;background:#18223b}.bubble.me{align-self:flex-end;background:#263da0}.bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px}.chatbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:100}.modal{width:min(780px,100%);max-height:88vh;overflow:auto;background:#0e1422;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;color:var(--text);font-size:25px;cursor:pointer}.dm-layout{display:grid;grid-template-columns:220px 1fr;gap:12px}.dm-users{display:grid;gap:7px;align-content:start}.dm-user{padding:9px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.dm-user.active{background:#17223b}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap}.prompt{font-size:20px;font-weight:800;line-height:1.45}.room{border:1px solid var(--line);background:#0c1220;border-radius:15px;padding:14px}.room-top{display:flex;justify-content:space-between;gap:8px}.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good)}.progress{height:9px;background:#0b1020;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:50%}.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.game-btn{padding:20px;border:1px solid var(--line);border-radius:14px;background:#111a2d;color:var(--text);font-size:27px;cursor:pointer}.ttt{display:grid;grid-template-columns:repeat(3,58px);gap:6px;margin:10px 0}.ttt button{height:58px;border:1px solid var(--line);border-radius:10px;background:#0d1628;color:var(--text);font-size:24px;font-weight:900;cursor:pointer}.quiz-options{display:grid;gap:7px;margin-top:10px}.avatar.frame-neon{box-shadow:0 0 0 3px #22d3ee,0 0 22px #22d3ee88}.avatar.frame-orbit{box-shadow:0 0 0 3px #8b5cf6,0 0 0 7px #8b5cf633;animation:frameOrbit 2.2s ease-in-out infinite alternate}.avatar.frame-gold{box-shadow:0 0 0 3px #fbbf24,0 0 24px #fbbf2477;animation:frameGold 1.8s ease-in-out infinite alternate}@keyframes frameOrbit{to{box-shadow:0 0 0 3px #22d3ee,0 0 0 9px #8b5cf622,0 0 28px #8b5cf666}}@keyframes frameGold{to{box-shadow:0 0 0 4px #fde68a,0 0 34px #fbbf24aa}}body[data-chat-theme="ocean"]{--accent:#22d3ee;--accent2:#2563eb}body[data-chat-theme="forest"]{--accent:#34d399;--accent2:#15803d}body[data-chat-theme="amoled"]{--bg:#000;--panel:#050505;--panel2:#0b0b0b;--line:#222}body[data-chat-theme="sunset"]{--accent:#fb7185;--accent2:#f59e0b}body[data-chat-theme="aurora"]{--accent:#5eead4;--accent2:#c084fc}.timer{font-size:48px;font-weight:900;text-align:center;letter-spacing:2px}.bottom{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#111b2e;border:1px solid var(--line);padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);max-width:360px}.skeleton{opacity:.6;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.3}}body.large-text{font-size:18px}body.high-contrast{--bg:#000;--panel:#050505;--panel2:#111;- <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth,onAuthStateChanged,getIdToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDA7ml6mEMjxmzF7SNy58zMO4qEholTlEg",authDomain:"strangertostranger-44cd4.firebaseapp.com",projectId:"strangertostranger-44cd4",storageBucket:"strangertostranger-44cd4.firebasestorage.app",messagingSenderId:"950218669345",appId:"1:950218669345:web:66b5e6ceb3591aa56c5260"};
const auth=getAuth(initializeApp(firebaseConfig));
const socket=io({autoConnect:false});
const state={token:"",user:null,boot:null,config:null,page:"home",match:null,dmUid:null,rooms:[],deferredInstall:null,timer:{seconds:1500,running:false,id:null}};
const pages=[['home','🏠','Home'],['match','✨','Match'],['connections','🤝','Connections'],['rooms','👥','Rooms'],['tools','🧰','Tools'],['profile','👤','Profile'],['safety','🛡️','Safety']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
function toast(msg,type=''){const r=qs('#toastRoot');r.innerHTML=`<div class="toast">${type==='bad'?'⚠️ ':type==='good'?'✅ ':''}${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3200)}
function avatar(p,cls='avatar'){const frame=['neon','orbit','gold'].includes(p?.avatarFrame)?` frame-${p.avatarFrame}`:'';return `<div class="${cls}${frame}" style="${p?.color?`background:${esc(p.color)}`:''}">${p?.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc((p?.displayName||'?').slice(0,2).toUpperCase())}</div>`}
function badges(p){const b=[p?.verified?'✓ Verified':'',p?.profileLevel||'',p?.accountAge?`Member ${p.accountAge}`:'',...(p?.badges||[]).slice(0,3)].filter(Boolean);return `<div class="badges">${b.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>`}
async function api(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(state.token)h.authorization=`Bearer ${state.token}`;const r=await fetch(path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function navHTML(){return pages.map(([id,ic,name])=>`<button data-page="${id}" class="${state.page===id?'active':''}">${ic} ${name}</button>`).join('')}
function renderNav(){qs('#nav').innerHTML=navHTML();qs('#bottomNav').innerHTML=pages.slice(0,6).map(([id,ic,name])=>`<button data-page="${id}" class="${state.page===id?'active':''}"><span>${ic}</span> ${name}</button>`).join('');qsa('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
window.showPage=showPage;function showPage(id){state.page=id;qsa('.page').forEach(x=>x.classList.remove('active'));qs('#page-'+id)?.classList.add('active');const p=pages.find(x=>x[0]===id);qs('#pageTitle').textContent=p?.[2]||id;qs('#subtitle').textContent={home:'Your daily social dashboard.',match:'Smart matching based on interests, languages and preferences.',connections:'Accepted connections, requests and private DMs.',rooms:'Communities, topic rooms, polls, events and study spaces.',tools:'AI-assisted tools, games, saved messages and study timer.',profile:'Interests, privacy, status, themes and notifications.',safety:'Reports, warnings, sessions, data controls and safety center.'}[id]||'';renderNav();renderPage(id)}
async function renderPage(id){if(!state.boot)return;if(id==='home')return renderHome();if(id==='match')return renderMatch();if(id==='connections')return renderConnections();if(id==='rooms')return renderRooms();if(id==='tools')return renderTools();if(id==='profile')return renderProfile();if(id==='safety')return renderSafety()}
function renderHome(){const p=state.boot.profile;qs('#page-home').innerHTML=`<div class="grid"><div class="card hero span8"><div class="muted">Welcome back, ${esc(p.displayName)}</div><h2>Meet people by interests, not exact location.</h2><p class="muted">Smart Match uses your language, country-level preference, timezone and interests while keeping precise location out of discovery.</p><div class="actions"><button class="btn primary" onclick="showPage('match')">✨ Find a Stranger</button><button class="btn" onclick="showPage('connections')">🤝 Connections</button></div></div><div class="card span4"><h3>Your reputation</h3><div style="font-size:42px;font-weight:900">${p.reputation}/100</div><div class="progress"><i style="width:${p.reputation}%"></i></div>${badges(p)}</div><div class="card span12"><div class="statrow"><div class="stat"><span class="muted">XP</span><b>${p.xp||0}</b></div><div class="stat"><span class="muted">Level</span><b>${esc(p.profileLevel)}</b></div><div class="stat"><span class="muted">Connections</span><b>${state.boot.connections.length}</b></div><div class="stat"><span class="muted">Requests</span><b>${state.boot.pendingReceived.length}</b></div></div></div><div class="card span6" id="dailyCard"><h3>💡 Daily Question</h3><div class="prompt skeleton">Loading…</div></div><div class="card span6"><h3>Quick actions</h3><div class="actions"><button class="btn" onclick="showPage('rooms')">🔎 Discover Rooms</button><button class="btn" onclick="location.href='/call.html'">🎙️ Voice Room</button><button class="btn" onclick="showPage('tools')">🧰 Study & AI Tools</button><button class="btn" onclick="openNotifications()">🔔 Notifications</button></div><p class="tiny">No exact GPS location is stored for matching.</p></div></div>`;api('/api/social/daily').then(d=>{qs('#dailyCard').innerHTML=`<h3>💡 Daily Question</h3><div class="prompt">${esc(d.question)}</div><p class="muted">${esc(d.discussion)}</p><button class="btn" id="dailyXp">Done +2 XP</button>`;qs('#dailyXp').onclick=async()=>{await api('/api/social/activity',{method:'POST',body:JSON.stringify({type:'daily'})});toast('Daily activity recorded','good')}})}
function selectedChips(items,selected,name){return `<div class="chips">${items.map(x=>`<button type="button" class="chip ${(selected||[]).includes(x)?'on':''}" data-chip="${name}" data-val="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
function renderMatch(){const p=state.boot.profile;qs('#page-match').innerHTML=`<div class="grid"><div class="card span4"><h3>Match Filters</h3><div class="form"><label>Preferred languages</label>${selectedChips(state.config.languages,p.matchFilters?.languages||[],'mf-lang')}<label>Preferred interests</label>${selectedChips(state.config.interests,p.matchFilters?.interests||[],'mf-int')}<label class="switch"><span>Same country only</span><input id="mfCountry" type="checkbox" ${p.matchFilters?.sameCountry?'checked':''}></label><label>Timezone</label><input id="mfTimezone" value="${esc(p.matchFilters?.timezone||'')}" placeholder="Asia/Kolkata"><button class="btn" id="saveFilters">Save filters</button></div></div><div class="card span8 matchbox"><div><h3>✨ Smart Match</h3><p class="muted">Temporary 1-to-1 chat. Connect only if both want a permanent connection.</p></div><div id="matchStage" class="match-partner"><div style="font-size:62px">🪐</div><h2>Ready to meet someone?</h2><p class="muted">Common interests and language increase the match score.</p></div><div><div id="matchChat" class="chatlog hidden"></div><div id="matchBar" class="chatbar hidden"><input id="matchInput" maxlength="2000" placeholder="Temporary message…"><button class="btn primary" id="matchSend">Send</button></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="findMatch">Find Stranger</button><button class="btn hidden" id="skipMatch">⏭ Skip / Next</button><button class="btn good hidden" id="connectMatch">🤝 Connect</button><button class="btn danger hidden" id="reportMatch">Report</button></div></div></div></div>`;wireChips();qs('#saveFilters').onclick=saveMatchFilters;qs('#findMatch').onclick=()=>{qs('#findMatch').disabled=true;qs('#matchStage').innerHTML='<div style="font-size:62px">🔎</div><h2>Searching…</h2><p class="muted">Looking for the best available match.</p>';socket.emit('social:match:find')};qs('#skipMatch').onclick=()=>socket.emit('social:match:skip');qs('#connectMatch').onclick=()=>state.match&&sendConnection(state.match.partner.uid);qs('#reportMatch').onclick=()=>state.match&&openReport(state.match.partner);qs('#matchSend').onclick=sendMatchMessage;qs('#matchInput').onkeydown=e=>{if(e.key==='Enter')sendMatchMessage()};qs('#matchInput').value=localStorage.getItem('s2s_match_draft')||'';qs('#matchInput').oninput=e=>localStorage.setItem('s2s_match_draft',e.target.value);if(state.match)showMatched(state.match)}
function wireChips(){qsa('[data-chip]').forEach(c=>c.onclick=()=>c.classList.toggle('on'))}async function saveMatchFilters(){const langs=qsa('[data-chip="mf-lang"].on').map(x=>x.dataset.val),ints=qsa('[data-chip="mf-int"].on').map(x=>x.dataset.val);await api('/api/social/profile',{method:'PUT',body:JSON.stringify({matchFilters:{sameCountry:qs('#mfCountry').checked,languages:langs,interests:ints,timezone:qs('#mfTimezone').value}})});await refresh();toast('Match filters saved','good')}

window.openRoom=id=>{localStorage.setItem('s2s_open_group_id',id);location.href='/Group-Chatroom.html?group='+encodeURIComponent(id)};window.voiceRoom=name=>location.href='/call.html?room='+encodeURIComponent('room-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'));async function createGroup(){try{const body={name:qs('#gName').value,description:qs('#gDesc').value,visibility:qs('#gVisibility').value,category:qs('#gCategory').value,password:qs('#gPassword').value,joinApproval:qs('#gApproval').checked,announcementsOnly:qs('#gAnn').checked,isCommunity:qs('#gCommunity').checked,slowModeSeconds:Number(qs('#gSlow').value||0),rules:qs('#gRules').value.split('\n').filter(Boolean)};await api('/api/social/groups',{method:'POST',body:JSON.stringify(body)});toast('Group created','good');renderRooms()}catch(e){toast(e.message,'bad')}}

ub.status)}<br>${esc(sub.note)}`;qs('#appealBtn').onclick=async()=>{try{await api('/api/social/appeals',{method:'POST',body:JSON.stringify({reason:qs('#appealText').value})});toast('Appeal submitted','good')}catch(e){toast(e.message,'bad')}};qs('#revokeSessions').onclick=async()=>{if(!confirm('Sign out all sessions?'))return;await api('/api/social/sessions/revoke-all',{method:'POST',body:'{}'});toast('Sessions revoked. Please sign in again.','good')};qs('#exportData').onclick=exportData;qs('#deleteAccount').onclick=deleteAccount}
async function exportData(){const d=await api('/api/social/account/export');const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stranger2stranger-data.json';a.click();URL.revokeObjectURL(a.href)}async function deleteAccount(){if(prompt('Type DELETE to permanently delete your account')!=='DELETE')return;await api('/api/social/account',{method:'DELETE',body:JSON.stringify({confirm:'DELETE'})});alert('Account deleted.');location.href='/login.html'}
window.openNotifications=async()=>{try{const d=await api('/api/social/notifications');modal(`<div class="modal-head"><h2>Notifications</h2><button class="close" onclick="closeModal()">×</button></div><div class="notify-list">${d.length?d.map(n=>`<div class="user"><div class="grow"><b>${esc(n.type||'Update')}</b><div>${esc(n.text)}</div><div class="tiny">${new Date(n.createdAt).toLocaleString()}</div></div>${n.read?'':'<span class="badge">new</span>'}</div>`).join(''):'<p class="muted">No notifications yet.</p>'}</div><button class="btn" id="markAll">Mark all read</button>`);qs('#markAll').onclick=async()=>{await api('/api/social/notifications/read',{method:'POST',body:'{}'});state.boot.unreadNotifications=0;qs('#notifCount').textContent='0';closeModal()}}catch(e){toast(e.message,'bad')}}
window.openReport=p=>{modal(`<div class="modal-head"><h2>Report ${esc(p.displayName)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Category</label><select id="reportCat">${state.config.reportCategories.map(x=>`<option value="${x}">${x}</option>`).join('')}</select><label>Details</label><textarea id="reportDetails" placeholder="What happened?"></textarea><button class="btn danger" id="sendReport">Submit report</button></div>`);qs('#sendReport').onclick=async()=>{try{await api('/api/social/reports',{method:'POST',body:JSON.stringify({uid:p.uid,category:qs('#reportCat').value,details:qs('#reportDetails').value})});closeModal();toast('Report submitted for moderator review','good')}catch(e){toast(e.message,'bad')}}}
function modal(html){qs('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}window.closeModal=()=>qs('#modalRoot').innerHTML='';
function applyAccessibility(){const p=state.boot?.profile||{},a=p.accessibility||{};document.body.classList.toggle('large-text',!!a.largeText);document.body.classList.toggle('reduce-motion',!!a.reducedMotion);document.body.classList.toggle('high-contrast',!!a.highContrast);document.body.dataset.chatTheme=p.chatTheme||'default'}
async function refresh(){state.boot=await api('/api/social/bootstrap');localStorage.setItem('s2s_social_cache',JSON.stringify({at:Date.now(),boot:state.boot}));qs('#topName').textContent=state.boot.profile.displayName;qs('#notifCount').textContent=state.boot.unreadNotifications||0;applyAccessibility()}
function wireSocket(){socket.on('connect',()=>socket.emit('join',{name:state.boot.profile.displayName,bio:state.boot.profile.bio||'',firebaseToken:state.token,isRejoining:true}));socket.on('join_success',()=>{});socket.on('social:error',m=>toast(m,'bad'));socket.on('social:match:searching',()=>{});socket.on('social:match:found',m=>{state.match=m;if(state.page==='match')showMatched(m);addMatchBubble('Matched! Say hello 👋',false,true)});socket.on('social:match:message',m=>addMatchBubble(m.text,false));socket.on('social:match:ended',m=>{addMatchBubble('Match ended: '+m.reason,false,true);state.match=null;if(state.page==='match')renderMatch()});socket.on('social:match:ready',()=>{state.match=null;if(state.page==='match'){renderMatch();setTimeout(()=>qs('#findMatch')?.click(),100)}});socket.on('social:notification',n=>{state.boot.unreadNotifications=(state.boot.unreadNotifications||0)+1;qs('#notifCount').textContent=state.boot.unreadNotifications;toast(n.text)});socket.on('social:dm:history',d=>{if(d.toUid!==state.dmUid)return;const l=qs('#dmChat');if(l)l.innerHTML='';d.messages.forEach(addDMBubble)});socket.on('social:dm:message',m=>{if(m.fromUid===state.dmUid||m.toUid===state.dmUid)addDMBubble(m);else toast(`${m.sender}: ${m.text}`)});socket.on('social:dm:read',()=>{if(state.dmUid)socket.emit('social:dm:history',{toUid:state.dmUid})});socket.on('force_logout',r=>{alert(r);location.href='/login.html'});socket.connect()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.deferredInstall=e;qs('#installBtn').classList.remove('hidden')});qs('#installBtn').onclick=async()=>{if(!state.deferredInstall)return;state.deferredInstall.prompt();await state.deferredInstall.userChoice;state.deferredInstall=null;qs('#installBtn').classList.add('hidden')};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const invite=new URLSearchParams(location.search).get('invite');async function handleInvite(){if(!invite)return;try{const d=await api('/api/social/groups/join-invite',{method:'POST',body:JSON.stringify({code:invite})});toast(d.pending?'Join request sent':'Joined group','good');showPage('rooms')}catch(e){toast(e.message,'bad')}}
onAuthStateChanged(auth,async user=>{if(!user){location.replace('/login.html');return}try{state.user=user;state.token=await getIdToken(user,true);localStorage.setItem('fbToken',state.token);state.config=await api('/api/social/config');await refresh();renderNav();renderHome();wireSocket();handleInvite();const hash=location.hash.replace('#','');if(pages.some(x=>x[0]===hash))showPage(hash);qs('#loading').remove()}catch(e){console.error(e);const cache=localStorage.getItem('s2s_social_cache');if(cache){try{state.boot=JSON.parse(cache).boot;renderNav();renderHome();qs('#loading').remove();toast('Offline cache loaded. Live actions need connection.')}catch{}}else{qs('#loading').innerHTML=`<div class="modal"><h2>Could not load Social Hub</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Retry</button></div>`}}});
</script>
</body></html>
