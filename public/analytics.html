<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S2S Admin Analytics</title><style>
:root{font-family:Inter,system-ui,sans-serif;--bg:#080b14;--p:#111827;--p2:#172033;--line:#2b3853;--t:#eef4ff;--m:#9caac8;--a:#67e8f9;--d:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t)}main{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px}.s3{grid-column:span 3}.s6{grid-column:span 6}.s12{grid-column:span 12}.stat b{font-size:30px;display:block}.muted{color:var(--m)}button,input{border:1px solid var(--line);background:var(--p2);color:var(--t);padding:10px 12px;border-radius:10px}.btn{cursor:pointer;font-weight:800}.danger{color:#ffc0cb}.bars{height:220px;display:flex;align-items:end;gap:8px;padding-top:20px}.bar{flex:1;min-width:24px;background:linear-gradient(#67e8f9,#7c3aed);border-radius:8px 8px 2px 2px;position:relative}.bar span{position:absolute;bottom:-25px;font-size:10px;color:var(--m);left:50%;transform:translateX(-50%)}.list{display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);background:#0d1422;border-radius:11px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.login{max-width:440px;margin:15vh auto}.hidden{display:none}@media(max-width:850px){.s3,.s6{grid-column:span 12}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="card login"><h2>Admin Analytics</h2><p class="muted">Enter the server-side panel password. The token is kept only in this tab session.</p><input id="token" type="password" placeholder="Panel password" style="width:100%"><button class="btn" id="go" style="width:100%;margin-top:10px">Open dashboard</button><div id="err" class="muted"></div></div>
<main id="dash" class="hidden"><div class="top"><div><h1>Stranger 2 Stranger Analytics</h1><div class="muted">Growth, moderation and server health.</div></div><div><button class="btn" onclick="location.href='/admin.html'">Admin Panel</button> <button class="btn" id="refresh">Refresh</button></div></div><div id="stats" class="grid"></div></main>
<script>
let token=sessionStorage.getItem('s2s_admin_token')||'';const $=s=>document.querySelector(s);async function call(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json','x-admin-token':token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const [a,q,audit]=await Promise.all([call('/api/social/admin/analytics'),call('/api/social/admin/modqueue'),call('/api/social/admin/audit')]);$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');render(a,q,audit)}catch(e){$('#err').textContent=e.message;$('#login').classList.remove('hidden');$('#dash').classList.add('hidden')}}function render(a,q,audit){const cards=[['Online now',a.online],['Active / 24h',a.activeUsers24],['Total users',a.users],['Total messages',a.totalMessages],['Messages / 24h',a.messages24],['Open reports',a.reportsOpen],['New users / 7d',a.newUsers7],['Connections',a.connections],['Groups',a.groups],['Open appeals',a.appeals],['Game players',a.gamePlayers],['Memory MB',a.server.memoryMB]];$('#stats').innerHTML=cards.map(x=>`<div class="card stat s3"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')+`<div class="card s6"><h3>Message activity — 7 days</h3><div class="bars">${chart(a.dailyMessages||[])}</div></div><div class="card s6"><h3>User growth — 7 days</h3><div class="bars">${chart(a.userGrowth||[])}</div></div><div class="card s6"><h3>Moderation categories</h3><div class="list">${(a.reportCategories||[]).map(x=>`<div class="item row"><span>${esc(x._id||'other')}</span><b>${x.count}</b></div>`).join('')||'<div class="muted">No reports</div>'}</div></div><div class="card s6"><h3>Server Health</h3><div class="list"><div class="item row"><span>Node</span><b>${esc(a.server.node)}</b></div><div class="item row"><span>Uptime</span><b>${Math.floor(a.server.uptimeSeconds/60)} min</b></div><div class="item row"><span>Memory RSS</span><b>${a.server.memoryMB} MB</b></div><div class="item row"><span>Game players</span><b>${a.gamePlayers}</b></div></div></div><div class="card s6"><h3>Report Review Queue</h3><div class="list">${q.reports.slice(0,20).map(r=>`<div class="item"><b>${esc(r.reportedUser||'User')}</b> · ${esc(r.category||'Other')}<div>${esc((r.reason||'').slice(0,180))}</div><div class="row" style="margin-top:8px"><span class="muted">${new Date(r.createdAt).toLocaleString()}</span><span><button class="btn" onclick="reviewReport('${r._id}','reviewing')">Review</button> <button class="btn" onclick="reviewReport('${r._id}','resolved')">Resolve</button> <button class="btn danger" onclick="reviewReport('${r._id}','dismissed')">Dismiss</button></span></div></div>`).join('')||'<div class="muted">No open reports.</div>'}</div></div><div class="card s6"><h3>Appeals</h3><div class="list">${q.appeals.slice(0,20).map(x=>`<div class="item"><b>${esc(x.displayName||'User')}</b><div>${esc((x.reason||'').slice(0,220))}</div><div class="row" style="margin-top:8px"><span class="muted">${new Date(x.createdAt).toLocaleString()}</span><span><button class="btn" onclick="reviewAppeal('${x._id}','reviewing')">Review</button> <button class="btn" onclick="reviewAppeal('${x._id}','accepted')">Accept</button> <button class="btn danger" onclick="reviewAppeal('${x._id}','rejected')">Reject</button></span></div></div>`).join('')||'<div class="muted">No open appeals.</div>'}</div></div><div class="card s12"><h3>AI-assisted / Safety Flags</h3><div class="list">${q.flaggedMessages.slice(0,20).map(m=>`<div class="item"><b>${esc(m.sender)}</b> · <span class="muted">${esc(m.room)}</span><div>${esc((m.text||'').slice(0,220))}</div><span class="muted">${esc((m.moderation?.reasons||[]).join(', '))}</span></div>`).join('')||'<div class="muted">No flagged messages.</div>'}</div></div><div class="card s12"><h3>Audit Logs</h3><div class="list">${audit.slice(0,60).map(x=>`<div class="item row"><div><b>${esc(x.action)}</b><div class="muted">${esc(x.target||'—')}</div></div><span class="muted">${new Date(x.createdAt).toLocaleString()}</span></div>`).join('')||'<div class="muted">No audit events yet.</div>'}</div></div>`}
window.reviewReport=async(id,status)=>{try{await call('/api/social/admin/reports/'+id,{method:'POST',body:JSON.stringify({status,note:''})});await load()}catch(e){alert(e.message)}};window.reviewAppeal=async(id,status)=>{try{await call('/api/social/admin/appeals/'+id,{method:'POST',body:JSON.stringify({status,note:''})});await load()}catch(e){alert(e.message)}};
function chart(rows){if(!rows.length)return '<div class="muted">No activity yet.</div>';const max=Math.max(...rows.map(x=>x.count),1);return rows.map(x=>`<div class="bar" title="${x._id}: ${x.count}" style="height:${Math.max(8,x.count/max*180)}px"><span>${x._id.slice(5)}</span></div>`).join('')}$('#go').onclick=()=>{token=$('#token').value;sessionStorage.setItem('s2s_admin_token',token);load()};$('#refresh').onclick=load;if(token)load();
</script></body></html>
